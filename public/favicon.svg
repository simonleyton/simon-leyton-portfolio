<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f86c9"/>
      <stop offset="1" stop-color="#6fb4e8"/>
    </linearGradient>
    <clipPath id="r"><rect width="32" height="32" rx="7"/></clipPath>
  </defs>
  <g clip-path="url(#r)">
    <rect width="32" height="32" fill="url(#sky)"/>
    <!-- Miami bay glow on the horizon -->
    <rect x="0" y="22" width="32" height="10" fill="#c7e4f7" opacity="0.5"/>
    <!-- Coral sun: the brand's period mark, constant across day/night.
         Paper ring gives a luminance edge so the disc reads against the
         near-isoluminant day sky (and for red-green color-blind users). -->
    <circle cx="16" cy="14" r="6.5" fill="#e85a5a" stroke="#fdfcf9" stroke-width="1.5"/>
  </g>
</svg>
